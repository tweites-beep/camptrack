:root[data-theme="light"] .bg{display:none}
h1{font-size:30px;line-height:1.15;margin:0 0 4px}
.date{color:var(--mute);margin:0 0 18px;line-height:2}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:20px}
.day{border:1.5px solid var(--line);background:none;color:var(--ink);border-radius:6px;padding:8px 0 7px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.day b{font:400 12px/1 Montserrat,sans-serif;color:var(--mute)}
.day span{font:700 18px/1.1 Oswald,Impact,sans-serif}
.day i{display:block;width:60%;height:3px;border-radius:2px;background:var(--line);margin-top:4px;overflow:hidden}
.day i u{display:block;height:100%;background:var(--ice);text-decoration:none}
.day[aria-pressed="true"]{background:var(--on);border-color:var(--on);color:var(--onink)}
.day[aria-pressed="true"] b{color:var(--onink);opacity:.75}
.day[aria-pressed="true"] i{background:rgba(26,26,26,.25)}
.day[aria-pressed="true"] i u{background:var(--onink)}
.score{display:flex;align-items:baseline;gap:12px;margin:0 0 6px}
.score strong{font:700 52px/1 Oswald,Impact,sans-serif;letter-spacing:.02em;color:var(--on)}
.score span{color:var(--mute)}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:26px}
.bar u{display:block;height:100%;background:var(--ice);text-decoration:none;transition:width .35s ease}
.camp{margin-bottom:28px}
.wk{display:flex;justify-content:space-between;gap:8px;margin:0 0 10px}
.wk button{background:none;border:1px solid var(--line);color:var(--mute);border-radius:6px;font:inherit;font-size:13px;padding:6px 12px;min-height:36px;cursor:pointer}
.wk button:focus-visible{outline:2px solid var(--on);outline-offset:2px}
.dly{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-top:12px}
.dly h3{font-size:14px;margin:0 0 4px;color:var(--ice)}
.dly .pct{font:700 36px/1 Oswald,Impact,sans-serif;letter-spacing:.02em}
.dly p{margin:4px 0 8px;line-height:1.6;font-size:14px}
.dly b{color:var(--ice);font-weight:600;margin-right:6px}
.spark i.cur{background:var(--on)}
.spark i.fut{opacity:.3}
.hero{display:grid;place-items:center;width:100%;aspect-ratio:8/3;margin:0 0 14px;border:1.5px dashed var(--line);border-radius:8px;background:var(--card) center/cover no-repeat;color:var(--mute);text-align:center;font-size:13px;line-height:1.6;cursor:pointer;overflow:hidden}
.hero b{color:var(--on);font-weight:600}
.hero.has{border-style:solid}
.hero:focus-within{outline:2px solid var(--on);outline-offset:2px}
.ch{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;border-bottom:1px solid var(--on);padding-bottom:10px;margin-bottom:12px}
.ch h2{font-size:17px;line-height:1.3;margin:0;color:var(--on)}
.ch small{color:var(--ice);font-size:13px}
.ch .ct{margin-left:auto;color:var(--mute);font-size:13px}
.pair{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:640px){.pair{grid-template-columns:1fr 1fr}}
.grp{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px 8px}
.gh{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 4px}
.gh h3{font-size:14px;margin:0}
.gh span{color:var(--mute);font-size:13px}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer;position:relative}
.row::before{content:"";position:absolute;left:13px;top:40px;height:24px;width:2px;background:var(--line);transition:background .3s}
.row:last-child::before{display:none}
.row.done::before{background:var(--on)}
.node{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;background:var(--card);position:relative;z-index:1;transition:background .2s,border-color .2s,transform .2s}
.node svg{width:14px;height:14px;stroke:var(--onink);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.5);transition:opacity .2s,transform .2s}
.row.done .node{background:var(--on);border-color:var(--on)}
.row.done .node svg{opacity:1;transform:none}
.row:active .node{transform:scale(.92)}
.row.work::before{background:var(--ice)}
.row.work .node{background:var(--ice);border-color:var(--ice)}
.row.work .node::after{content:"";position:absolute;top:50%;left:50%;width:8px;height:8px;border-radius:50%;background:var(--onink);transform:translate(-50%,-50%)}
.key{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--mute);font-size:13px;margin:-14px 0 24px}
.key span{display:inline-flex;align-items:center;gap:7px}
.key i{width:12px;height:12px;border-radius:50%;display:inline-block}
.key .w{background:var(--ice)}
.key .d{background:var(--on)}
.lbl{font-weight:400;font-size:16px}
.tag{margin-left:auto;color:var(--mute);font-size:13px}
.row.done .lbl{color:var(--mute)}
.row:focus-visible,.day:focus-visible,.clear:focus-visible{outline:2px solid var(--on);outline-offset:2px;border-radius:8px}
.set{margin:6px 0 10px;color:var(--mute)}
.set summary{cursor:pointer;line-height:2}
.set label{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0}
.set input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.clear{background:none;border:0;color:var(--mute);font:inherit;text-decoration:underline;cursor:pointer;padding:8px 0;line-height:2}
.note{color:var(--mute);margin:6px 0 0}
.rep{background:var(--card);border:1px solid var(--on);border-radius:8px;padding:16px;margin:0 0 14px}
.rep h2{font-size:15px;margin:0 0 6px;color:var(--on)}
.rep .pct{font:700 48px/1 Oswald,Impact,sans-serif;letter-spacing:.02em}
.rep p{margin:4px 0 8px;line-height:1.6}
.rep b{color:var(--ice);font-weight:600;margin-right:6px}
.spark{display:flex;align-items:flex-end;gap:4px;height:36px;margin:8px 0 12px}
.spark i{flex:1;min-height:2px;background:var(--ice);border-radius:2px}
.fn{color:var(--mute);font-size:13px;line-height:1.6;margin:8px 0 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

let D={};try{D=JSON.parse(localStorage.getItem("ecmg-post-dates")||"{}")}catch(e){}
let E={};try{E=JSON.parse(localStorage.getItem("ecmg-post-ends")||"{}")}catch(e){}
const end=cp=>{const v=E[cp.k||"a"];return v!==undefined?v:(cp.e||"")};
let wkOff=0;
const start=cp=>D[cp.k||"a"]||cp.d;
const pd=s=>{const p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])};
const dd=(a,b)=>Math.round((a-b)/864e5);
function ph(cp,f){const x=dd(pd(f),pd(start(cp)));if(x<0)return{p:"pre"};const en=end(cp);if(en&&dd(pd(f),pd(en))>0)return{p:"post"};const cy=cp.n+(cp.b?2:0),pos=x%cy,r=Math.floor(x/cy)+1;return pos<cp.n?{p:"day",i:pos+1,r,pos,x}:pos===cp.n?{p:"bonus",r,pos,x}:{p:"prep",r,pos,x}}
function stage(cp,f){const q=ph(cp,f);if(q.p==="post")return "Ended";if(q.p==="pre")return "Not started";if(q.p==="bonus")return "Bonus day";if(q.p==="prep")return "Prep day";return "Day "+q.i+" of "+cp.n+(q.r>1?", round "+q.r:"")}
function weekDays(){const ad=pd(C.map(start).sort()[0]),t0=new Date(today.getFullYear(),today.getMonth(),today.getDate()),diff=dd(t0,ad),off=(diff>0?Math.floor(diff/7)*7:0)+wkOff*7;return [...Array(7)].map((_,k)=>{const d=new Date(ad);d.setDate(ad.getDate()+off+k);return d})}
const ids=(cp,f)=>{const q=ph(cp,f);return q.p==="day"?P.flatMap(g=>g.i.map(i=>cp.k+i[0])):q.p==="bonus"?BON.map(i=>cp.k+i[0]):q.p==="prep"?PREP.map(i=>cp.k+i[0]):[]};
const slots=f=>C.flatMap(cp=>ids(cp,f));
const st=(f,id)=>{const v=(S[f]||{})[id];return v===true?2:(v||0)};
const cnt=f=>slots(f).filter(id=>st(f,id)===2).length;
const wrk=f=>slots(f).filter(id=>st(f,id)===1).length;
let IM={};try{IM=JSON.parse(localStorage.getItem("ecmg-post-imgs")||"{}")}catch(e){}
const hero=cp=>{const k=cp.k||"a",u=IM[k];return '<label class="hero'+(u?' has':'')+'"'+(u?' style="background-image:url('+u+')"':'')+'><input type="file" accept="image/*" data-img="'+k+'" hidden>'+(u?'':'<span><b>Campaign image</b><br>1600 \u00d7 600 px (8:3)<br>Tap to upload \u00b7 keep key content centered</span>')+'</label>'};
let sel=fmt(today);
const CHK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function report(cp,f){
  const q=ph(cp,f);
  if(q.p!=="bonus"&&!(q.p==="day"&&(q.i===cp.n||f===end(cp))))return "";
  const s0=q.x-q.pos,rows=P.flatMap(g=>g.i.map(i=>({id:cp.k+i[0],n:i[1]+((i[1]==="IG"||i[1]==="FB")?" "+i[2]:""),m:0})));
  const rs=pd(start(cp));rs.setDate(rs.getDate()+s0);const en=end(cp),len=en?Math.max(1,Math.min(cp.n,dd(pd(en),rs)+1)):cp.n;
  let done=0;const per=[],tot=rows.length*len;
  for(let k=0;k<len;k++){const d=pd(start(cp));d.setDate(d.getDate()+s0+k);const key=fmt(d);let dn=0;
    rows.forEach(r=>{if(st(key,r.id)===2){dn++;done++}else r.m++});per.push(dn)}
  const won=rows.filter(r=>r.m===0).map(r=>r.n),lost=rows.filter(r=>r.m>0).sort((a,b)=>b.m-a.m);
  return '<section class="rep"><h2 class="hd">'+cp.t+' report</h2><div class="pct">'+Math.round(done/tot*100)+'%</div><p>'+done+' of '+tot+' posts live over '+len+' days'+(q.p==="day"?' so far':'')+'</p><div class="spark">'+per.map(v=>'<i style="height:'+Math.round(v/rows.length*100)+'%"></i>').join("")+'</div><p><b>Won</b> '+(won.length?won.join(", "):"No platform hit every day")+'</p><p><b>Missed</b> '+(lost.length?lost.map(r=>r.n+" x"+r.m).join(", "):"Nothing missed")+'</p></section>';
}
function daily(cp,f){
  const q=ph(cp,f);if(q.p!=="day")return "";
  const rows=P.flatMap(g=>g.i.map(i=>({id:cp.k+i[0],n:i[1]+((i[1]==="IG"||i[1]==="FB")?" "+i[2]:"")})));
  const s0=q.x-q.pos,per=[];
  for(let k=0;k<cp.n;k++){const d=pd(start(cp));d.setDate(d.getDate()+s0+k);const key=fmt(d);per.push(rows.filter(r=>st(key,r.id)===2).length)}
  const T=rows.length,n=per[q.pos],pv=q.pos>0?per[q.pos-1]:null,tot=per.slice(0,q.pos+1).reduce((a,b)=>a+b,0);
  const miss=rows.filter(r=>st(f,r.id)!==2).map(r=>r.n),lab=f<fmt(today)?"Missed":"Still open";
  const tr=pv===null?"First day of the round":n>pv?"Up "+(n-pv)+" from yesterday":n<pv?"Down "+(pv-n)+" from yesterday":"Same as yesterday";
  return '<div class="dly"><h3 class="hd">Day '+q.i+' report</h3><div class="pct">'+Math.round(n/T*100)+'%</div><p>'+n+' of '+T+' posts live. '+tr+'.</p><div class="spark">'+per.map((v,k)=>'<i class="'+(k===q.pos?'cur':k>q.pos?'fut':'')+'" style="height:'+Math.round(v/T*100)+'%"></i>').join("")+'</div><p><b>Round to date</b>'+Math.round(tot/(T*(q.pos+1))*100)+'%</p><p><b>'+lab+'</b>'+(miss.length?miss.join(", "):"Nothing, all live")+'</p></div>';
}
function render(){
  const a=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.id:null;
  const days=weekDays();if(!days.some(d=>fmt(d)===sel))sel=fmt(days[0]);
  const cur=S[sel]||{},c=cnt(sel),t=slots(sel).length;
  const dn=id=>cur[id]===true||cur[id]===2,wk=id=>cur[id]===1;
  const sd=days.find(d=>fmt(d)===sel);
  document.getElementById("date").textContent=sd.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
  document.getElementById("days").innerHTML=days.map(d=>{const f=fmt(d),tt=slots(f).length;return '<button class="day" type="button" data-day="'+f+'" aria-pressed="'+(f===sel)+'" aria-label="'+d.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"})+'"><b>'+d.toLocaleDateString(undefined,{weekday:"short"})+'</b><span>'+d.getDate()+'</span><i><u style="width:'+(tt?Math.round(cnt(f)/tt*100):0)+'%"></u></i></button>'}).join("");
  document.getElementById("n").textContent=c+"/"+t;
  document.getElementById("msg").textContent=!t?"nothing scheduled":c===t?"All "+t+" live. Nice work.":"live"+(wrk(sel)?", "+wrk(sel)+" in progress":"");
  document.getElementById("fill").style.width=(t?Math.round(c/t*100):0)+"%";
  const row=(id,l,tg)=>'<button class="row'+(dn(id)?" done":wk(id)?" work":"")+'" type="button" role="checkbox" aria-checked="'+(dn(id)?"true":wk(id)?"mixed":"false")+'" data-id="'+id+'"><span class="node">'+CHK+'</span><span class="lbl">'+l+'</span>'+(tg?'<span class="tag">'+tg+'</span>':'')+'</button>';
  const grp=(name,items,k)=>'<div class="grp"><div class="gh"><h3 class="hd">'+name+'</h3><span>'+items.filter(i=>dn(k+i[0])).length+' of '+items.length+'</span></div>'+items.map(i=>row(k+i[0],i[1],i[2])).join("")+'</div>';
  document.getElementById("camps").innerHTML=C.map(cp=>{
    const q=ph(cp,sel),its=ids(cp,sel);if(q.p==="post")return "";
    const body=q.p==="day"?'<div class="pair">'+P.map(g=>grp(g.n,g.i,cp.k)).join("")+'</div>':q.p==="prep"?'<div class="pair">'+grp("Prep day",PREP,cp.k)+'</div>':q.p==="bonus"?'<div class="pair">'+grp("Bonus day",BON,cp.k)+'</div>':'<p class="note">Not started yet.</p>';
    return '<section class="camp">'+hero(cp)+'<div class="ch"><h2 class="hd">'+cp.t+'</h2>'+(cp.s?'<small>'+cp.s+'</small>':'')+'<small>'+stage(cp,sel)+'</small>'+(its.length?'<span class="ct">'+its.filter(dn).length+' of '+its.length+'</span>':'')+'</div>'+body+daily(cp,sel)+'</section>';
  }).join("");
  document.getElementById("report").innerHTML=C.map(cp=>report(cp,sel)).join("");
  if(a){const el=document.querySelector('[data-id="'+a+'"]');if(el)el.focus()}
}
document.addEventListener("click",e=>{
  const r=e.target.closest("[data-id]"),d=e.target.closest("[data-day]"),w=e.target.closest("[data-wk]");
  if(r){S[sel]=S[sel]||{};const v=st(sel,r.dataset.id);S[sel][r.dataset.id]=(v+1)%3;save();render()}
  else if(d){sel=d.dataset.day;render()}
  else if(w){if(w.dataset.wk==="0"){wkOff=0;sel=fmt(today)}else{wkOff+=+w.dataset.wk;sel=""}render()}
});
document.getElementById("clear").addEventListener("click",()=>{S[sel]={};save();render()});
document.getElementById("dates").innerHTML=C.map(cp=>'<label>'+cp.t+' start<input type="date" data-k="'+(cp.k||"a")+'" value="'+start(cp)+'"></label><label>'+cp.t+' end<input type="date" data-e="'+(cp.k||"a")+'" value="'+end(cp)+'"></label>').join("");
document.addEventListener("change",e=>{const k=e.target.dataset&&e.target.dataset.k;if(k&&e.target.value){D[k]=e.target.value;try{localStorage.setItem("ecmg-post-dates",JSON.stringify(D))}catch(x){}render();return}
  const q=e.target.dataset&&e.target.dataset.e;if(q){E[q]=e.target.value;try{localStorage.setItem("ecmg-post-ends",JSON.stringify(E))}catch(x){}render()}});
document.addEventListener("change",e=>{
  const t=e.target,f=t.dataset&&t.dataset.img&&t.files&&t.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
    const W=1600,H=600,c=document.createElement("canvas");c.width=W;c.height=H;
    const sc=Math.max(W/im.width,H/im.height),w=im.width*sc,h=im.height*sc;
    c.getContext("2d").drawImage(im,(W-w)/2,(H-h)/2,w,h);
    IM[t.dataset.img]=c.toDataURL("image/jpeg",.82);
    try{localStorage.setItem("ecmg-post-imgs",JSON.stringify(IM))}catch(x){}
    render()};im.src=r.result};r.readAsDataURL(f)});
render();
</script>
</body>
